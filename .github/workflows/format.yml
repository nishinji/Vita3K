name: Format Check

on:
  push:
    paths:
      - .clang-format
      - .ci/check-format.sh
      - .github/workflows/format.yml
      - vita3k/**
      - tools/**

  pull_request:
    paths:
      - .clang-format
      - .ci/check-format.sh
      - .github/workflows/format.yml
      - vita3k/**
      - tools/**

jobs:
  format-check:
    name: Format Check (${{ matrix.path }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        path:
          - vita3k
          - tools

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .ci
            ${{ matrix.path }}

      - name: Install clang-format
        run: pipx install clang-format==22.1.8

      - name: Format check
        run: bash .ci/check-format.sh ${{ matrix.path }}
        env:
          PATCH_FILE: clang-format-${{ matrix.path }}.patch

      - name: Upload patch
        if: failure() && hashFiles(format('clang-format-{0}.patch', matrix.path)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: clang-format-patch-${{ matrix.path }}
          path: clang-format-${{ matrix.path }}.patch
