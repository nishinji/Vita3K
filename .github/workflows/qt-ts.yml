# Publishes the Crowdin source for the Qt UI. The translations themselves live in
# nishinji/vita3k_translations, which picks this artifact up.

name: Generate Qt translation template

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'vita3k/gui-qt/**'
      - 'vita3k/main.cpp'
      - 'tools/i18n/generate_qt_template.py'
      - '.github/workflows/qt-ts.yml'

jobs:
  generate-template:
    name: Generate Qt translation template
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the Qt linguist tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools

      - name: Generate the template
        run: python3 tools/i18n/generate_qt_template.py

      - name: Upload the template
        uses: actions/upload-artifact@v7
        with:
          name: Vita3K_Translation_Template
          path: template/vita3k_template.ts
          compression-level: 0
